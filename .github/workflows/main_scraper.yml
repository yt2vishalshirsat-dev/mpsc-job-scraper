name: Auto Job Scraper via API

on:
  schedule:
    - cron: '0 */3 * * *' # प्रत्येक ३ तासांनी आपोआप रन होईल
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper & Push via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_NAME: "yt2vishalshirsat-dev/mpsc-job-scraper"
        run: |
          python -c '
          import os, json, base64, requests
          
          # Run your scraping logic or load jobs.json
          # (For testing, we ensure jobs.json is generated by your scraper.py)
          import subprocess
          subprocess.run(["python", "scraper.py"])
          
          with open("jobs.json", "r", encoding="utf-8") as f:
              content = f.read()
              
          encoded_content = base64.b64encode(content.encode("utf-8")).decode("utf-8")
          token = os.environ["GH_PAT"]
          repo = os.environ["REPO_NAME"]
          
          url = f"https://api.github.com/repos/{repo}/contents/jobs.json"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }
          
          # Get current file SHA (required by GitHub API to update existing file)
          res = requests.get(url, headers=headers)
          sha = res.json().get("sha") if res.status_code == 200 else None
          
          payload = {
              "message": "Auto-update jobs.json via GitHub API",
              "content": encoded_content
          }
          if sha:
              payload["sha"] = sha
              
          put_res = requests.put(url, headers=headers, json=payload)
          print("API Response:", put_res.status_code, put_res.text)
          '
