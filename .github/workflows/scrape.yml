name: Run Job Scraper

on:
  scheduled:
    # दर ३ तासांनी रन होण्यासाठी Cron expression (UTC वेळेनुसार चालते)
    - cron: '0 */3 * * *'
  
  # Manual Run बटन (Workflow dispatch) चालू ठेवायचे असेल तर हे ठेवा
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push changes if jobs.json updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jobs.json [skip ci]" && git push)
