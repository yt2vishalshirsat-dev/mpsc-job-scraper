name: Auto Job Scraper & Push Notifier

on:
  workflow_dispatch:
  schedule:
    # दर ३० मिनिटांनी स्वयंचलितपणे रन होईल
    - cron: '*/30 * * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin supabase

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python scraper.py

      - name: Commit and Push updated jobs.json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@example.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jobs.json [skip ci]" && git push)
