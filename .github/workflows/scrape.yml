name: Auto Job Scraper & Push Notifier

on:
  workflow_dispatch:  # हा मॅन्युअली रन करण्यासाठी (Run Workflow बटण)
  schedule:
    - cron: '30 4 * * *'  # दररोज सकाळी १०:०० वाजता (IST नुसार) ऑटोमॅटिक रन होईल

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin supabase

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python scraper.py
