name: Auto Job Scraper

on:
  schedule:
    - cron: '0 */3 * * *' # दर ३ तासांनी आपोआप रन होईल
  workflow_dispatch: # मॅन्युअली रन करण्यासाठी

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # गिटची पूर्ण हिस्टरी फेच करण्यासाठी (Rebase साठी गरजेचे)

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push jobs.json Safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "Auto-update jobs.json via scraper" || exit 0
          git pull origin main --rebase
          git push origin main
