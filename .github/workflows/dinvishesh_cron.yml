name: Daily Dinvishesh Auto-Populate & Notifier

on:
  workflow_dispatch:
  schedule:
    # रोज सकाळी ठीक ८:०० वाजता (IST) रन होण्यासाठी
    - cron: '30 2 * * *'

jobs:
  run-dinvishesh-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin supabase

      - name: Run Dinvishesh Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python dinvishesh_notifier.py
