name: Auto Forum Post Bot

on:
  schedule:
    # 7 AM IST to 10 PM IST (UTC timings: 1:30 AM UTC to 4:30 PM UTC)
    - cron: '0 2-16 * * *'
  
  workflow_dispatch: # मॅन्युअल टेस्टसाठी

jobs:
  run-forum-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Supabase Library
        run: |
          pip install supabase

      - name: Run Auto Forum Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_forum_bot.py
